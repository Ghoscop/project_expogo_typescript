name: CI

'on':
  push:
  pull_request:

jobs:
  verificar:
    name: Verificar projeto
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar Expo
        run: npx expo-doctor

      - name: Verificar TypeScript
        run: npx tsc --noEmit